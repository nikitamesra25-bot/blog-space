<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - BlogSpace</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">Blog<span>Space</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="login.html" class="nav-btn">Login</a>
    </nav>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <h1>Create Account</h1>
      <p>Join BlogSpace and start sharing your stories.</p>

      <form id="registerForm">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password" minlength="6" required>

        <button type="submit" class="btn auth-btn">Create Account</button>
      </form>

      <p class="auth-switch">
        Already have an account?
        <a href="login.html">Login</a>
      </p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
