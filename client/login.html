<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - BlogSpace</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">Blog<span>Space</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="register.html" class="nav-btn">Register</a>
    </nav>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <h1>Welcome Back!</h1>
      <p>Login to continue your blogging journey.</p>

      <form id="loginForm">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>

        <button type="submit" class="btn auth-btn">Login</button>
      </form>

      <p class="auth-switch">
        Don't have an account?
        <a href="register.html">Create Account</a>
      </p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
