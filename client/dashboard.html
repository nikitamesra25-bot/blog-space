<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - BlogSpace</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">Blog<span>Space</span></a>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="create-blog.html" class="nav-btn">Write Blog</a>
      <button id="logoutBtn" class="logout-btn">Logout</button>
    </nav>
  </header>

  <main class="dashboard-container">
    <section class="dashboard-welcome">
      <div>
        <span class="tag">YOUR SPACE</span>
        <h1>Welcome to Your Dashboard</h1>
        <p>Explore blogs and share your own stories.</p>
      </div>
      <a href="create-blog.html" class="btn">+ Create New Blog</a>
    </section>

    <section class="blogs-section">
      <div class="section-heading">
        <h2>Latest Blogs</h2>
        <p>Read interesting stories from our community.</p>
      </div>

      <div id="blogsContainer" class="blogs-grid">
        <p>Loading blogs...</p>
      </div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
