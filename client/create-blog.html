<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Blog - BlogSpace</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">Blog<span>Space</span></a>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <button id="logoutBtn" class="logout-btn">Logout</button>
    </nav>
  </header>

  <main class="create-container">
    <div class="create-card">
      <span class="tag">CREATE SOMETHING AMAZING</span>
      <h1>Write Your Blog</h1>
      <p>Share your thoughts and experiences with the world.</p>

      <form id="createBlogForm">
        <label for="title">Blog Title</label>
        <input type="text" id="title" placeholder="Enter your blog title" required>

        <label for="content">Blog Content</label>
        <textarea id="content" rows="10" placeholder="Start writing your story..." required></textarea>

        <label for="imageUrl">Image URL (Optional)</label>
        <input type="url" id="imageUrl" placeholder="https://example.com/image.jpg">

        <button type="submit" class="btn auth-btn">Publish Blog</button>
      </form>

      <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/create-blog.js"></script>
</body>
</html>
